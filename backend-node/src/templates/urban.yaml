id: urban
name: 都市
name_en: Urban
description: 现代都市背景下的职场、情感或生活故事，贴近年轻人
character_archetypes:
  male: 都市白领或创业者，25-35岁，有理想有担当，面临成长挑战
  female: 职场精英或自由职业者，22-30岁，独立自信，追求自我价值
  support: [ 职场良师益友, 闺蜜闺弟, 家人长辈 ]
classic_tropes:
  - 职场升职记
  - 城市漂泊者
  - 意外同居
  - 分手后重新开始
three_act_structure:
  act1: 主角在都市生活中遇到转折点，面临选择与压力
  act2: 通过努力结识贵族人，逐步改善处境，核心目标初见成效
  act3: 达成重要里程碑，实现自我超越，与志同道合者共创未来
rhythm_pattern: [4,6,8,9,10,7,8,9,10,8,9,10,9,8,10,10,9,8,9,10,10,9,8,10]