id: suspense
name: 悬疑
name_en: Suspense
description: 层层递进的谜题解密，紧张刺激的推理过程
character_archetypes:
  male: 侦探型主角或关键嫌疑人，28-35岁，观察敏锐，逻辑严密
  female: 与案件相关重要人物，24-30岁，聪慧机敏，可能是线索提供者
  support: [ 神秘线人, 警察伙伴, 隐藏凶手 ]
classic_tropes:
  - 密室杀人
  - 连环案件
  - 身份互换
  - 真相只有一个
three_act_structure:
  act1: 案件发生，主角卷入调查，初步发现异常线索
  act2: 深入调查，层层剥开表象，嫌疑人浮出水面，但新疑点不断
  act3: 关键证据浮出水面，真相大白，凶手绳之以法
rhythm_pattern: [6,8,9,10,8,7,9,10,9,8,10,10,9,8,10,10,9,8,10,10,9,8,10,10,10]