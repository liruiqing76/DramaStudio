id: sci-fi
name: 科幻
name_en: Sci-Fi
description: 未来科技或外星文明背景下的探索与冒险，脑洞大开
character_archetypes:
  male: 宇航员/科学家/机甲驾驶员，28-35岁，智勇双全，探索精神强
  female: 外交官/战士/科研人员，24-30岁，聪慧果敢，不畏艰险
  support: [ 人工智能伙伴, 外星盟友, 神秘组织 ]
classic_tropes:
  - 时间扭曲
  - 星际战争
  - 人机共生
  - 文明重建
three_act_structure:
  act1: 主角意外卷入宇宙事件或发现关键线索，踏上未知旅程
  act2: 在探索过程中结识伙伴，遭遇文明冲突，核心秘密渐露
  act3: 揭开终极真相，影响文明存亡的决策与行动，留下希望火种
rhythm_pattern: [5,8,9,10,9,7,9,10,10,8,9,10,10,9,10,10,9,8,10,10,10,9,10,10]